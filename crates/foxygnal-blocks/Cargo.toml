[package]
name = "foxygnal-blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cpal = { version = "0.18.2", optional = true }
foxygnal-core = { version = "0.1.0", path = "../foxygnal-core" }
foxygnal-dsp = { version = "0.1.0", path = "../foxygnal-dsp" }
foxygnal-sdr = { version = "0.1.0", path = "../foxygnal-sdr" }
hound = "3.5.1"
serde_json = "1.0.154"

[dev-dependencies]
num-complex = "0.4.6"

[lints]
workspace = true

[features]
# Audio sink/source via cpal. Off by default: on Linux it needs the ALSA headers
# (`libasound2-dev` / `alsa-lib`).
audio = ["dep:cpal"]
