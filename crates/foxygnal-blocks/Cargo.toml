[package]
name = "foxygnal-blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck = "1.25.2"
cpal = { version = "0.18.2", optional = true }
foxygnal-core = { version = "0.1.0", path = "../foxygnal-core" }
foxygnal-dsp = { version = "0.1.0", path = "../foxygnal-dsp" }
foxygnal-sdr = { version = "0.1.0", path = "../foxygnal-sdr" }
hound = "3.5.1"
png = "0.18.1"
miniz_oxide = "0.9.1"
zune-jpeg = "0.5.15"
rustfft = "6.4.1"
serde_json = "1.0.154"
socket2 = "0.6.5"

[dev-dependencies]
criterion = { version = "0.8.0", default-features = false, features = ["cargo_bench_support"] }
num-complex = "0.4.6"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"

[[bench]]
name = "blocks"
harness = false

[lints]
workspace = true

[features]
# Audio sink/source via cpal. Off by default: on Linux it needs the ALSA headers
# (`libasound2-dev` / `alsa-lib`).
audio = ["dep:cpal"]
