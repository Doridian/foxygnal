[package]
name = "foxygnal-plugin"
description = "Load foxygnal block plugins (WebAssembly components) with wasmtime"
version.workspace = true
edition.workspace = true
# wasmtime's minimum.
license.workspace = true
repository.workspace = true

[dependencies]
foxygnal-core = { version = "0.1.0", path = "../foxygnal-core" }
serde_json = "1.0.154"
tracing = "0.1.44"
# Lean wasmtime: Cranelift, the component model, no WASI, no async, no
# on-disk cache (plugins are small; they compile at startup).
wasmtime = { version = "51.0.0", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
# Turns a core module built with the SDK (wasm32-unknown-unknown) into a
# component at load time, so plugin authors need no extra tools.
wit-component = { version = "0.263.0", default-features = false }

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
foxygnal-blocks = { version = "0.1.0", path = "../foxygnal-blocks" }

[[bench]]
name = "plugin"
harness = false

[lints]
workspace = true
