[package]
name = "foxygnal-dsp"
description = "DSP math shared by foxygnal blocks and probes: windows, FFT spectra, FIR design, resamplers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck = "1.25.2"
num-complex = { version = "0.4.6", features = ["bytemuck"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }

[[bench]]
name = "kernels"
harness = false

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "0.8.0", default-features = false, features = ["cargo_bench_support"] }
