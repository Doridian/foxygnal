[package]
name = "foxygnal-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
foxygnal-blocks = { version = "0.1.0", path = "../foxygnal-blocks" }
foxygnal-core = { version = "0.1.0", path = "../foxygnal-core" }
foxygnal-dsp = { version = "0.1.0", path = "../foxygnal-dsp" }
foxygnal-grc = { version = "0.1.0", path = "../foxygnal-grc" }
foxygnal-sdr = { version = "0.1.0", path = "../foxygnal-sdr" }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
rust-embed = { version = "8.14.0", features = ["mime-guess"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-std", "io-util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"

[lints]
workspace = true

[features]
# Embed ui/dist into the binary (build the UI first).
embed-ui = ["dep:rust-embed"]

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
