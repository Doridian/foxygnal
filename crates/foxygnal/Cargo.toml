[package]
name = "foxygnal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
foxygnal-blocks = { version = "0.1.0", path = "../foxygnal-blocks" }
foxygnal-core = { version = "0.1.0", path = "../foxygnal-core" }
foxygnal-sdr = { version = "0.1.0", path = "../foxygnal-sdr" }
foxygnal-server = { version = "0.1.0", path = "../foxygnal-server" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[features]
# Ship the browser UI inside the binary. Build it first: `cd ui && npm run build`.
embed-ui = ["foxygnal-server/embed-ui"]
# Audio sink/source blocks (cpal). Needs the ALSA headers on Linux.
audio = ["foxygnal-blocks/audio"]

[lints]
workspace = true
