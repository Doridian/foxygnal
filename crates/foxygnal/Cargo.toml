[package]
name = "foxygnal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
foxygnal-blocks = { version = "0.1.0", path = "../foxygnal-blocks" }
foxygnal-core = { version = "0.1.0", path = "../foxygnal-core" }
foxygnal-server = { version = "0.1.0", path = "../foxygnal-server" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
