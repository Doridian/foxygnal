# Graph variables and hierarchical blocks: two copies of the
# tone-and-noise.fox.toml sub-graph, tuned from variables, mixed and throttled.
# Change `base` while running: both tones follow, live.
#   foxygnal run examples/hier-tones.fox.toml   (runs until Ctrl-C)

[vars]
samp_rate = "48k"
base = 1500.0

[[block]]
id = "low"
kind = "graph:tone-and-noise.fox.toml"
params = { rate = "$samp_rate", freq = "$base", amplitude = 0.6, noise = 0.02 }
ui = { x = 50, y = 40 }

[[block]]
id = "high"
kind = "graph:tone-and-noise.fox.toml"
params = { rate = "$samp_rate", freq = "-$base * 3", amplitude = 0.2, noise = 0.0 }
ui = { x = 50, y = 220 }

[[block]]
id = "mix"
kind = "add"
params = { type = "c32" }
ui = { x = 390, y = 130 }

[[block]]
id = "throttle"
kind = "throttle"
params = { type = "c32", sample_rate = "$samp_rate" }
ui = { x = 680, y = 130 }

[[block]]
id = "sink"
kind = "null_sink"
params = { type = "c32" }
ui = { x = 960, y = 130 }

[[connect]]
from = "low.out"
to = "mix.a"

[[connect]]
from = "high.out"
to = "mix.b"

[[connect]]
from = "mix.out"
to = "throttle.in"

[[connect]]
from = "throttle.out"
to = "sink.in"
