# APRS (1200 Bd AX.25 packet radio): positions, Mic-E, status, messages and
# objects from the 2 m APRS channel.
#
# 144.390 MHz is the APRS frequency in North America; use 144.800 MHz in
# Europe and Africa (145.175 MHz in Australia, 144.640 MHz in China, 144.660
# MHz in Japan). The AFSK demodulator copes with or without de-emphasis, so
# `deemphasis` on the FM demodulator can stay off. Click the wire into `log`
# and choose Messages:
#
#   t=12.345 src=N0CALL-9 dst=APRS path=WIDE1-1,WIDE2-1 type=position lat=… lon=… sym=/> comment="…"
#
#   SDR 2.4 MS/s ──xlate ÷50──▶ 48 kS/s ──FM demod──▶ AFSK 1200 ──bits──▶ HDLC/AX.25 ──text──▶ log
#
#   foxygnal run examples/aprs.fox.toml   (prints the packets: stdout = true)

[vars]
freq = "144.39M"
offset = "250k"
samp_rate = "2.4M"

[[block]]
id = "sdr"
kind = "sdr_source"
params = { device = "", frequency = "$freq - $offset", sample_rate = "$samp_rate", gain = 40.0 }
ui = { x = 50, y = 120 }

[[block]]
id = "channel"
kind = "freq_xlating_fir"
params = { offset = "$offset", cutoff = 7500.0, transition = 5000.0, decimation = 50, window = "hamming" }
ui = { x = 380, y = 120 }

[[block]]
id = "demod"
kind = "fm_demod"
params = { deviation = 5000.0, deemphasis = "off" }
ui = { x = 700, y = 120 }

[[block]]
id = "afsk"
kind = "afsk1200_demod"
params = { output = "bits" }
ui = { x = 1030, y = 120 }

[[block]]
id = "ax25"
kind = "hdlc_deframer"
params = { format = "ax25", nrzi = true, check_fcs = true }
ui = { x = 1350, y = 120 }

[[block]]
id = "log"
kind = "message_log"
params = { stdout = true }
ui = { x = 1680, y = 120 }

[[connect]]
from = "sdr.out"
to = "channel.in"

[[connect]]
from = "channel.out"
to = "demod.in"

[[connect]]
from = "demod.out"
to = "afsk.in"

[[connect]]
from = "afsk.out"
to = "ax25.in"

[[connect]]
from = "ax25.out"
to = "log.in"
