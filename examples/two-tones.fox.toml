# Two complex tones plus noise, running forever at 48 kS/s: something to look at.
# Click any wire in the browser to watch it with a scope, spectrum, waterfall,
# constellation or level meter.
#   foxygnal serve, then load "Two tones + noise" from the start page.

[[block]]
id = "carrier"
kind = "signal_source"
params = { type = "c32", waveform = "sine", frequency = 2000.0, amplitude = 0.6, sample_rate = 48000.0 }
ui = { x = 40, y = 20 }

[[block]]
id = "spur"
kind = "signal_source"
params = { type = "c32", waveform = "sine", frequency = -7500.0, amplitude = 0.15, sample_rate = 48000.0 }
ui = { x = 40, y = 170 }

[[block]]
id = "noise"
kind = "noise_source"
params = { type = "c32", amplitude = 0.03 }
ui = { x = 40, y = 320 }

[[block]]
id = "tones"
kind = "add"
params = { type = "c32" }
ui = { x = 290, y = 90 }

[[block]]
id = "sum"
kind = "add"
params = { type = "c32" }
ui = { x = 520, y = 200 }

[[block]]
id = "throttle"
kind = "throttle"
params = { type = "c32", sample_rate = 48000.0 }
ui = { x = 750, y = 200 }

[[block]]
id = "sink"
kind = "null_sink"
params = { type = "c32" }
ui = { x = 980, y = 200 }

[[connect]]
from = "carrier.out"
to = "tones.a"

[[connect]]
from = "spur.out"
to = "tones.b"

[[connect]]
from = "tones.out"
to = "sum.a"

[[connect]]
from = "noise.out"
to = "sum.b"

[[connect]]
from = "sum.out"
to = "throttle.in"

[[connect]]
from = "throttle.out"
to = "sink.in"
