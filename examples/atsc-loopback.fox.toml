# ATSC loopback: an MPEG transport stream file through an ATSC 8VSB
# modulator, a noisy channel 20 kHz off frequency, and the ATSC demodulator,
# with no radio.
#
#   TS file ──throttle──▶ ATSC mod ──×tone──+noise──▶ ATSC demod ──▶ TS
#                    8VSB, 10.76 MS/s                            └─▶ status log
#
# ATSC carries a fixed 19.39 Mbit/s of TS (312 packets per 24.2 ms field), so
# the file must be muxed at that rate. Make one with ffmpeg (a test picture
# and tone, MPEG-2 video + AC-3 as on air, padded to the ATSC rate):
#
#   ffmpeg -f lavfi -i testsrc=size=1280x720:rate=30000/1001 -f lavfi -i sine=frequency=1000 \
#     -t 60 -c:v mpeg2video -b:v 12M -maxrate 12M -bufsize 6M -g 15 \
#     -c:a ac3 -b:a 384k -f mpegts -muxrate 19392658 atsc-test.ts
#
# and put it in the project directory (or next to this file for `foxygnal run`).
# The file loops. Watch `demod.status` (Messages) for the lock, MER, the
# frequency and clock offsets and the RS counts, and the spectrum on the wire
# into `demod` (the pilot is the line near the lower band edge). Click the
# wire out of `demod.ts` and choose Video to watch the picture.
# Raise `noise` to find the threshold (C/N in the 6 MHz channel =
# 10·log10(0.0625 / (0.5575 · noise²)) dB; 0.035 is about 19.6 dB and the
# demodulator decodes cleanly down to about 15.3 dB, noise ≈ 0.058).
#
# This runs the whole channel at 10.76 MS/s: it needs a fast machine.
#
#   foxygnal run examples/atsc-loopback.fox.toml

[vars]
fs = "4.5M * 684 / 286"
ts_rate = "$fs * 312 * 188 / (313 * 832)"
offset = "20k"
noise = 0.035

[[block]]
id = "ts_file"
kind = "file_source"
params = { type = "u8", path = "atsc-test.ts", repeat = true, sample_rate = "$ts_rate" }
ui = { x = 50, y = 60 }

[[block]]
id = "realtime"
kind = "throttle"
params = { type = "u8", sample_rate = 0 }
ui = { x = 300, y = 60 }

[[block]]
id = "mod"
kind = "atsc_modulator"
params = { sample_rate = "$fs", gain = 0.25 }
ui = { x = 550, y = 60 }

[[block]]
id = "carrier"
kind = "signal_source"
params = { type = "c32", waveform = "sine", frequency = "$offset", amplitude = 1.0, sample_rate = "$fs" }
ui = { x = 550, y = 220 }

[[block]]
id = "shift"
kind = "multiply"
params = { type = "c32" }
ui = { x = 830, y = 120 }

[[block]]
id = "noise"
kind = "noise_source"
params = { type = "c32", amplitude = "$noise", seed = 0 }
ui = { x = 830, y = 280 }

[[block]]
id = "channel"
kind = "add"
params = { type = "c32" }
ui = { x = 1080, y = 160 }

[[block]]
id = "demod"
kind = "atsc_demodulator"
params = {}
ui = { x = 1330, y = 160 }

[[block]]
id = "ts_out"
kind = "null_sink"
params = { type = "u8" }
ui = { x = 1630, y = 100 }

[[block]]
id = "log"
kind = "message_log"
params = { stdout = true }
ui = { x = 1630, y = 240 }

[[connect]]
from = "ts_file.out"
to = "realtime.in"

[[connect]]
from = "realtime.out"
to = "mod.in"

[[connect]]
from = "mod.out"
to = "shift.a"

[[connect]]
from = "carrier.out"
to = "shift.b"

[[connect]]
from = "shift.out"
to = "channel.a"

[[connect]]
from = "noise.out"
to = "channel.b"

[[connect]]
from = "channel.out"
to = "demod.in"

[[connect]]
from = "demod.ts"
to = "ts_out.in"

[[connect]]
from = "demod.status"
to = "log.in"
