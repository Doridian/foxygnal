# AIS: ship positions, names and voyages from both maritime AIS channels.
#
# AIS transponders send 9600 Bd GMSK bursts on 161.975 MHz (channel A) and
# 162.025 MHz (channel B). One receiver tuned halfway between them, at 162.000
# MHz, sees both: two channel filters cut out ±25 kHz, each with its own FM
# demodulator and AIS decoder, and both decoders write into one log. A
# vertical antenna near the coast or a big river is enough; ships are heard
# 20–40 km away, coast stations and aids to navigation further.
#
# Click a wire into `log` and choose Messages:
#
#   t=12.345 ch=A mmsi=366053209 type=1 status=restricted lat=37.802118 lon=-122.341618 sog=0.0 cog=219.3 heading=1 …
#   t=13.012 ch=B mmsi=351759000 type=5 imo=9134270 callsign="3FOF8" name="EVER DIADEM" shiptype=70 … dest="NEW YORK"
#
#            ┌─xlate −25 kHz ÷25─▶ FM demod ─▶ AIS (ch A) ─┐
#   SDR 1.2 MS/s                                           ├─▶ log
#            └─xlate +25 kHz ÷25─▶ FM demod ─▶ AIS (ch B) ─┘
#
#   foxygnal run examples/ais.fox.toml   (prints the messages: stdout = true)
#
# Set `format = "nmea"` on the decoders for `!AIVDM` sentences (for OpenCPN
# and other chart plotters: add a UDP Sink on each decoder's output). If the
# receiver's crystal is far off (more than ~3 kHz at 162 MHz, ~20 ppm), set
# `ppm` on the SDR.

[vars]
freq = "162M"
samp_rate = "1.2M"

[[block]]
id = "sdr"
kind = "sdr_source"
params = { device = "", frequency = "$freq", sample_rate = "$samp_rate", gain = 40.0, ppm = 0.0 }
ui = { x = 50, y = 200 }

[[block]]
id = "chan_a"
kind = "freq_xlating_fir"
params = { offset = -25000.0, cutoff = 7500.0, transition = 5000.0, decimation = 25, window = "hamming" }
ui = { x = 380, y = 80 }

[[block]]
id = "chan_b"
kind = "freq_xlating_fir"
params = { offset = 25000.0, cutoff = 7500.0, transition = 5000.0, decimation = 25, window = "hamming" }
ui = { x = 380, y = 320 }

[[block]]
id = "fm_a"
kind = "fm_demod"
params = { deviation = 2400.0, deemphasis = "off" }
ui = { x = 700, y = 80 }

[[block]]
id = "fm_b"
kind = "fm_demod"
params = { deviation = 2400.0, deemphasis = "off" }
ui = { x = 700, y = 320 }

[[block]]
id = "ais_a"
kind = "ais_decoder"
params = { channel = "A", format = "text" }
ui = { x = 1030, y = 80 }

[[block]]
id = "ais_b"
kind = "ais_decoder"
params = { channel = "B", format = "text" }
ui = { x = 1030, y = 320 }

[[block]]
id = "log"
kind = "message_log"
params = { stdout = true, inputs = 2 }
ui = { x = 1350, y = 200 }

[[connect]]
from = "sdr.out"
to = "chan_a.in"

[[connect]]
from = "sdr.out"
to = "chan_b.in"

[[connect]]
from = "chan_a.out"
to = "fm_a.in"

[[connect]]
from = "chan_b.out"
to = "fm_b.in"

[[connect]]
from = "fm_a.out"
to = "ais_a.in"

[[connect]]
from = "fm_b.out"
to = "ais_b.in"

[[connect]]
from = "ais_a.out"
to = "log.in"

[[connect]]
from = "ais_b.out"
to = "log.in1"
