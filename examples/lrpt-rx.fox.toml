# Meteor-M LRPT: weather pictures from Meteor-M N2-3 and N2-4 at 137.1 or
# 137.9 MHz, with an RTL-SDR and a simple antenna (a V-dipole or QFH for
# 137 MHz, outdoors with a view of the sky).
#
#   SDR 1.024 MS/s ─▶ xlate ÷4 ─▶ demod ─▶ packets ─▶ dec ─image─▶ PNG files
#   tracker ─offset─┘ (Doppler)     └─status─▶ log ◀─out─┘
#
# The satellite sends its MSU-MR imager's channels (usually 1, 2 and 3 by
# day, or 1, 2 and 4) as JPEG-coded scans of 8 rows; the decoder puts them
# together into one long picture per pass. Click the wire out of
# `dec.image` and choose Image to watch the 2-2-1 colour composite grow as
# the satellite passes (`dec.ch1`…`dec.ch6`: the channels in grey);
# `pictures` saves each pass as a PNG file in `lrpt-pictures/` when it ends.
# `log` shows the demodulator's lock, carrier offset, MER and Reed-Solomon
# statistics once a second, and a line per scan.
#
# Which satellite is on which frequency, and in which mode, changes now and
# then: the usual is offset QPSK at 72 kBd (demod `mode = "oqpsk72"`); `oqpsk80`
# is their 80 kBd test mode (interleaved: pictures start 16 s after lock);
# `qpsk72` is the old Meteor-M N2. Check a current status page before a
# pass.
#
# Doppler (±3.3 kHz at 137.9 MHz) is within the demodulator's search range
# (±18 kHz) on its own; the tracker keeps the channel centred anyway, which
# leaves the search the tuner's frequency error. Set `lat`, `lon`, `alt` to
# your position and paste fresh element sets (CelesTrak's "Weather" group)
# into the tracker; the palette's Passes section lists the next passes and
# *Track* picks the satellite. Without a tracker, delete it and its wire:
# the channel's `offset` then stays where it is set.

[vars]
lat = 52.52
lon = 13.405
alt = 34
downlink = "137.9M"
center = "137.65M"
samp_rate = "1.024M"

[[block]]
id = "sdr"
kind = "sdr_source"
params = { device = "", frequency = "$center", sample_rate = "$samp_rate", gain = 40.0 }
ui = { x = 50, y = 120 }

[[block]]
id = "tracker"
kind = "sat_tracker"
params = { satellite = "METEOR-M2 3", lat = "$lat", lon = "$lon", alt = "$alt", frequency = "$downlink", offset = "$downlink - $center", min_elevation = 10.0, rate = 20.0, tle_file = "", time = "", tle = """
METEOR-M2 3
1 57166U 23091A   26327.52301369 -.00000007  00000+0  15745-4 0  9992
2 57166  98.5884  19.0681 0004988  73.2184 286.9542 14.24057105177198
METEOR-M2 4
1 59051U 24039A   26327.50722175 -.00000013  00000+0  13685-4 0  9998
2 59051  98.7256 284.9730 0008115  71.3466 288.8592 14.22444296141910
""" }
ui = { x = 50, y = 320 }

[[block]]
id = "channel"
kind = "freq_xlating_fir"
# `offset` is only the starting value: the tracker's wire sets it.
params = { offset = "$downlink - $center", cutoff = 75000.0, transition = 30000.0, decimation = 4, window = "hamming" }
ui = { x = 380, y = 120 }

[[block]]
id = "demod"
kind = "lrpt_demodulator"
params = { mode = "oqpsk72", offset = 0.0 }
ui = { x = 700, y = 120 }

[[block]]
id = "packets"
kind = "ccsds_packets"
params = { frame_len = 1020, rs_interleave = 4, insert_zone = 2, trailer = 0, format = "records" }
ui = { x = 1000, y = 80 }

[[block]]
id = "dec"
kind = "lrpt_decoder"
params = { red = "2", green = "2", blue = "1", vcid = 5, gap = 100 }
ui = { x = 1280, y = 80 }

[[block]]
id = "pictures"
kind = "image_sink"
params = { dir = "lrpt-pictures", prefix = "meteor", min_rows = 64 }
ui = { x = 1580, y = 40 }

[[block]]
id = "log"
kind = "message_log"
params = { stdout = true, inputs = 3 }
ui = { x = 1280, y = 360 }

[[connect]]
from = "sdr.out"
to = "channel.in"

[[connect]]
from = "tracker.offset"
to = "channel.@offset"

[[connect]]
from = "channel.out"
to = "demod.in"

[[connect]]
from = "demod.frames"
to = "packets.in"

[[connect]]
from = "packets.out"
to = "dec.in"

[[connect]]
from = "dec.image"
to = "pictures.in"

[[connect]]
from = "demod.status"
to = "log.in"

[[connect]]
from = "dec.out"
to = "log.in1"

[[connect]]
from = "tracker.track"
to = "log.in2"
