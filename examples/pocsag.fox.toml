# POCSAG pager decoder: 512, 1200 and 2400 Bd, numeric and alphanumeric.
#
# Set `freq` to a paging channel used in your area (in North America paging
# sits around 929–932 MHz; elsewhere look for bursty FSK near 150–170 MHz or
# 466 MHz). The FM demodulator runs without de-emphasis so the decoder sees
# the flat NRZ signal; the decoder finds the bit rate and the polarity by
# itself. Click the wire into `log` and choose Messages:
#
#   t=12.345 baud=1200 ric=1234567 func=3 type=alpha msg="…"
#
#   SDR 2.4 MS/s ──xlate ÷50──▶ 48 kS/s ──FM demod (flat)──▶ POCSAG ──text──▶ log
#
#   foxygnal run examples/pocsag.fox.toml   (prints the messages: stdout = true)
#
# Pager messages can be personal: decode only what you may lawfully receive,
# and don't share what you read.

[vars]
freq = "929.6125M"
offset = "250k"
samp_rate = "2.4M"

[[block]]
id = "sdr"
kind = "sdr_source"
params = { device = "", frequency = "$freq - $offset", sample_rate = "$samp_rate", gain = 40.0 }
ui = { x = 50, y = 120 }

[[block]]
id = "channel"
kind = "freq_xlating_fir"
params = { offset = "$offset", cutoff = 9000.0, transition = 6000.0, decimation = 50, window = "hamming" }
ui = { x = 380, y = 120 }

[[block]]
id = "demod"
kind = "fm_demod"
params = { deviation = 4500.0, deemphasis = "off" }
ui = { x = 700, y = 120 }

[[block]]
id = "pocsag"
kind = "pocsag_decoder"
params = { baud = "auto", format = "auto", fix_errors = 2 }
ui = { x = 1030, y = 120 }

[[block]]
id = "log"
kind = "message_log"
params = { stdout = true }
ui = { x = 1350, y = 120 }

[[connect]]
from = "sdr.out"
to = "channel.in"

[[connect]]
from = "channel.out"
to = "demod.in"

[[connect]]
from = "demod.out"
to = "pocsag.in"

[[connect]]
from = "pocsag.out"
to = "log.in"
