# Plugin sources. A workspace of its own: plugins build for
# wasm32-unknown-unknown, not the host. See docs/PLUGINS.md.
#
#   cargo build --release --target wasm32-unknown-unknown
#   cp target/wasm32-unknown-unknown/release/foxygnal_example.wasm ~/.local/share/foxygnal/plugins/
[workspace]
resolver = "3"
members = ["example", "misbehave"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
