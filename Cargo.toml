[workspace]
resolver = "3"
members = ["crates/*"]
# Plugin sources build for wasm32 in a workspace of their own (docs/PLUGINS.md).
exclude = ["plugins"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://git.foxden.network/FoxDen/foxygnal"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Smaller debug builds: CI caches target/ (rust-cache), and full DWARF for
# every dependency made it ~5 GB. Line tables keep backtraces readable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
